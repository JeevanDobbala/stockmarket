<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stocks</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            background-color: #0d6efd;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin: 30px 0;
        }

        /* Table styling */
        table {
            width: 85%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background-color: #343a40;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Buy form */
        form {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        input[type="number"] {
            width: 70px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Buy button */
        button {
            padding: 6px 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        /* Back link */
        .back-link {
            display: block;
            margin: 25px auto;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            color: #0d6efd;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="navbar">TradeX</div>

<h2>Available Stocks</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Stock Name</th>
        <th>Symbol</th>
        <th>Price</th>
        <th>Action</th>
    </tr>

    <tr th:each="stock : ${stocks}">
        <td th:text="${stock.stockId}"></td>
        <td th:text="${stock.stockName}"></td>
        <td th:text="${stock.stockSymbol}"></td>
        <td th:text="${stock.currentPrice}"></td>

        <td>
            <form th:action="@{/buy}" method="post">
                <input type="hidden" name="stockId" th:value="${stock.stockId}" />
                <input type="number" name="quantity" min="1" required />
                <button type="submit">Buy</button>
            </form>
        </td>
    </tr>
</table>

<a href="/dashboard" class="back-link">← Back to Dashboard</a>

</body>
</html>
