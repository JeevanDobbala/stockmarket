<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin - Stocks</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    /* Navbar */
    .navbar {
        background-color: #0d6efd;
        padding: 15px;
        text-align: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
    }

    /* Container */
    .container {
        width: 90%;
        max-width: 1000px;
        margin: 40px auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    /* Add button */
    .add-btn {
        display: inline-block;
        margin-bottom: 15px;
        padding: 10px 15px;
        background: green;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }

    .add-btn:hover {
        background: orange;
    }

    /* Table */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        background: #0d6efd;
        color: white;
        padding: 12px;
    }

    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    tr:hover {
        background: #f1f1f1;
    }

    /* Action buttons */
    .edit-btn {
        padding: 6px 12px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 4px;
    }

    .edit-btn:hover {
        background: #218838;
    }

    .delete-btn {
        padding: 6px 12px;
        background: #dc3545;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        margin-left: 5px;
    }

    .delete-btn:hover {
        background: #b02a37;
    }

    /* Back link */
    .back-link {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: #0d6efd;
        font-weight: bold;
    }

    .back-link:hover {
        text-decoration: underline;
    }
</style>

</head>
<body>

<div class="navbar">TradeX</div>

<div class="container">

    <h2>Manage Stocks</h2>

    <a href="/admin/stocks/new" class="add-btn">+ Add New Stock</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Symbol</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <tr th:each="stock : ${stocks}">
            <td th:text="${stock.stockId}"></td>
            <td th:text="${stock.stockName}"></td>
            <td th:text="${stock.stockSymbol}"></td>
            <td th:text="${stock.currentPrice}"></td>
            <td>
                <a th:href="@{/admin/stocks/edit/{id}(id=${stock.stockId})}" class="edit-btn">Edit</a>
                <a th:href="@{/admin/stocks/delete/{id}(id=${stock.stockId})}"
                   class="delete-btn"
                   onclick="return confirm('Are you sure to delete this stock?');">Delete</a>
            </td>
        </tr>
    </table>

    <a href="/dashboard" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
