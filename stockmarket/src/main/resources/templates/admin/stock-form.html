<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            background-color: #0d6efd;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Form container */
        .container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        /* Submit button */
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        /* Back link */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="navbar">TradeX</div>

<div class="container">

    <h2 th:text="${stock.stockId != null} ? 'Edit Stock' : 'Add New Stock'"></h2>

    <form th:action="${stock.stockId != null} ? @{/admin/stocks/update/{id}(id=${stock.stockId})} : @{/admin/stocks}" 
          th:object="${stock}" method="post">

        <label>Name:</label>
        <input type="text" th:field="*{stockName}" required />

        <label>Symbol:</label>
        <input type="text" th:field="*{stockSymbol}" required />

        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{currentPrice}" required />

        <button type="submit">Save</button>
    </form>

    <a href="/admin/stocks" class="back-link">← Back to Stocks</a>

</div>

</body>
</html>
