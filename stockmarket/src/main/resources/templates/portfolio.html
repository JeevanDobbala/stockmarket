<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Portfolio</title>
<style>
body {
	font-family: Arial, sans-serif;
	background-color: #f5f6fa;
	margin: 0;
	padding: 0;
}

h2 {
	text-align: center;
	margin-top: 30px;
	color: #2f3640;
}

table {
	width: 80%;
	margin: 20px auto;
	border-collapse: collapse;
	background-color: #ffffff;
	box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}

th, td {
	padding: 12px 15px;
	text-align: center;
	border-bottom: 1px solid #ddd;
}

th {
	background-color: #4CAF50;
	color: white;
	text-transform: uppercase;
	letter-spacing: 0.1em;
}

tr:hover {
	background-color: #f1f1f1;
}

.sell-btn {
	background-color: #e84118;
	color: white;
	border: none;
	padding: 6px 12px;
	cursor: pointer;
	border-radius: 5px;
	transition: background-color 0.3s ease;
}

.sell-btn:hover {
	background-color: #c23616;
}

.back-link {
	display: block;
	width: 200px;
	margin: 30px auto;
	text-align: center;
	text-decoration: none;
	background-color: #40739e;
	color: white;
	padding: 10px;
	border-radius: 5px;
	transition: background-color 0.3s ease;
}

.back-link:hover {
	background-color: #273c75;
}
</style>
</head>
<body>

	<h2>My Portfolio</h2>

	<table>
		<tr>
			<th>Stock Name</th>
			<th>Symbol</th>
			<th>Quantity</th>
			<th>Avg Price</th>
			<th>Action</th>
		</tr>

		<tr th:each="p : ${portfolios}">
			<td th:text="${p.stock.stockName}"></td>
			<td th:text="${p.stock.stockSymbol}"></td>
			<td th:text="${p.quantity}"></td>
			<td th:text="${p.averagePrice}"></td>
			<td>
				<form th:action="@{/selling}" method="post">
					<input type="hidden" name="stockId" th:value="${p.stock.stockId}" />

					<input type="number" name="quantity" min="1" th:max="${p.quantity}"
						value="1" />

					<button type="submit" class="sell-btn">Sell</button>
				</form>

			</td>
		</tr>
	</table>

	<a href="/dashboard" class="back-link">Back to Dashboard</a>

</body>
</html>
